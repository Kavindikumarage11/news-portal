<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Portal</title>
    <!-- Bootstrap CSS for modern styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Global News Portal</a>
            <a class="btn btn-outline-light btn-sm" href="/admin.html">Admin Dashboard</a>
        </div>
    </nav>

    <!-- News Section Container -->
    <div class="container my-5">
        <h2 class="mb-4 text-center fw-bold">Latest News Updates</h2>
        <hr>
        <div id="news-container" class="row g-4 mt-2">
            <!-- News cards will be dynamically generated here from MySQL Database -->
        </div>
    </div>

    <!-- JavaScript to Fetch Data from Backend (SELECT Operation) -->
    <script>
        fetch('/api/news')
            .then(response => response.json())
            .then(newsArticles => {
                const container = document.getElementById('news-container');
                if (newsArticles.length === 0) {
                    container.innerHTML = '<div class="col-10 mx-auto text-center"><p class="text-muted fs-5">No news articles available at the moment.</p></div>';
                    return;
                }
                newsArticles.forEach(news => {
                    container.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm border-0">
                                <img src="${news.image_url || 'https://via.placeholder.com/300'}" class="card-img-top" alt="news image" style="height: 200px; object-fit: cover;">
                                <div class="card-body">
                                    <span class="badge bg-danger mb-2">${news.category.toUpperCase()}</span>
                                    <h5 class="card-title fw-bold">${news.title}</h5>
                                    <p class="card-text text-secondary">${news.content.substring(0, 120)}...</p>
                                </div>
                                <div class="card-footer bg-white border-0 text-muted small">
                                    Published: ${new Date(news.created_at).toLocaleDateString()}
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(error => console.error('Error fetching news:', error));
    </script>
</body>
</html>
