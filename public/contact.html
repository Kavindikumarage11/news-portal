<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Global News Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/index.html">Global News Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/index.html">Home</a>
                <a class="nav-link" href="/about.html">About Us</a>
                <a class="nav-link active" href="/contact.html">Contact Us</a>
            </div>
        </div>
    </nav>

    <!-- Contact Form Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm border-0">
                    <h3 class="fw-bold mb-3 text-center">Get In Touch</h3>
                    <p class="text-muted text-center mb-4">Have any questions or feedback? Drop us a message below.</p>
                    
                    <form onsubmit="alert('Thank you for contacting us! Your message has been simulated successfully.'); this.reset(); return false;">
                        <div class="mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" required placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="4" required placeholder="Type your message here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
