<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - News Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand" href="#">Admin Control Center</a>
            <a class="btn btn-light btn-sm" href="/index.html">View Live Site</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <!-- Left Side: Form to INSERT News -->
            <div class="col-md-5 mb-4">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="fw-bold mb-3 text-secondary">Create a New Post</h4>
                    <form id="news-form">
                        <div class="mb-3">
                            <label class="form-label">Article Title</label>
                            <input type="text" id="title" class="form-control" required placeholder="Enter news title">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="category" class="form-select">
                                <option value="Local">Local</option>
                                <option value="International">International</option>
                                <option value="Sports">Sports</option>
                                <option value="Technology">Technology</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" id="image_url" class="form-control" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Content Description</label>
                            <textarea id="content" class="form-control" rows="5" required placeholder="Write the full news details here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold">Publish Article</button>
                    </form>
                </div>
            </div>

            <!-- Right Side: List to DELETE News -->
            <div class="col-md-7">
                <div class="card p-4 shadow-sm border-0">
                    <h4 class="fw-bold mb-3 text-secondary">Manage Existing Articles</h4>
                    <ul id="admin-news-list" class="list-group">
                        <!-- Articles will load here with a Delete button -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for INSERT and DELETE Operations -->
    <script>
        const form = document.getElementById('news-form');
        const list = document.getElementById('admin-news-list');

        function loadAdminNews() {
            list.innerHTML = '';
            fetch('/api/news')
                .then(res => res.json())
                .then(data => {
                    data.forEach(news => {
                        list.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center mb-2 shadow-sm border-0 rounded">
                                <div>
                                    <strong class="d-block">${news.title}</strong>
                                    <small class="text-muted">Category: ${news.category}</small>
                                </div>
                                <button class="btn btn-danger btn-sm fw-bold" onclick="deleteNews(${news.id})">Delete</button>
                            </li>
                        `;
                    });
                });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newsData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                image_url: document.getElementById('image_url').value,
                content: document.getElementById('content').value
            };

            fetch('/api/news', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newsData)
            })
            .then(res => res.json())
            .then(response => {
                alert(response.message);
                form.reset();
                loadAdminNews();
            });
        });

        function deleteNews(id) {
            if(confirm("Are you sure you want to delete this article?")) {
                fetch(`/api/news/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(response => {
                    alert(response.message);
                    loadAdminNews();
                });
            }
        }

        loadAdminNews();
    </script>
</body>
</html>
